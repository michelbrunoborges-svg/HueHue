# HueHue Switch: compila o app UWP para Xbox Series X|S (Dev Mode) e publica o .appx.
#
# Roda num runner Windows do GitHub (o build UWP exige Visual Studio 2022 + Store CRT).
# Ao final, cria um Release com tudo que o Device Portal do Xbox pede:
#   huehue-switch.appx, Microsoft.VCLibs.x64.14.00.appx (dependencia) e huehue-switch.cer.
name: Build Xbox (appx)

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-xbox
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}\..\cpm-cache
      CI_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Versao do pacote (cada build instala por cima da anterior)
        shell: pwsh
        run: |
          $v = "0.3.${{ github.run_number }}.0"
          $m = "dist\uwp\AppxManifest.xml"
          # So o Version do <Identity> (MinVersion/MaxVersionTested ficam como estao).
          $xml = Get-Content $m -Raw
          $re = [regex]'(?s)(<Identity\b[^>]*?\sVersion=")[0-9.]+(")'
          $new = $re.Replace($xml, { param($x) $x.Groups[1].Value + $v + $x.Groups[2].Value }, 1)
          if ($new -eq $xml) { throw "nao achei Identity/@Version no manifesto" }
          Set-Content $m $new -NoNewline -Encoding utf8
          "APP_VERSION=$v" | Out-File $env:GITHUB_ENV -Append
          Write-Host "versao: $v"

      - name: Conferir Visual Studio com ferramentas UWP (Store CRT)
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          Write-Host "VS: $vs"
          $store = Get-ChildItem "$vs\VC\Tools\MSVC\*\lib\x64\store" -ErrorAction SilentlyContinue
          if (-not $store) {
            Write-Host "Store CRT ausente: instalando o componente UWP do VS..."
            $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
            $p = Start-Process $installer -ArgumentList "modify --installPath `"$vs`" --add Microsoft.VisualStudio.ComponentGroup.UWP.VC --add Microsoft.VisualStudio.Component.UWP.VC.ARM64 --quiet --norestart --nocache" -Wait -PassThru
            Write-Host "vs_installer saiu com $($p.ExitCode)"
            if (-not (Get-ChildItem "$vs\VC\Tools\MSVC\*\lib\x64\store" -ErrorAction SilentlyContinue)) { throw "Store CRT continua ausente" }
          }

      - name: NASM (para o OpenSSL)
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files\NASM\nasm.exe")) { choco install nasm -y --no-progress }
          if (-not (Test-Path "C:\Program Files\NASM\nasm.exe")) { throw "NASM nao instalou" }
          & "C:\Program Files\NASM\nasm.exe" -v
          exit 0

      - name: glslang (shaders do video_core)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Descobre o zip Windows do release continuo do glslang pelo nome, que muda entre versoes.
          $rel = Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } "https://api.github.com/repos/KhronosGroup/glslang/releases/tags/main-tot"
          $asset = $rel.assets | Where-Object { $_.name -match 'windows' -and $_.name -match 'Release' -and $_.name -like '*.zip' } | Select-Object -First 1
          if (-not $asset) { $rel.assets.name; throw "zip Windows do glslang nao encontrado" }
          Write-Host "glslang: $($asset.name)"
          $zip = "$env:RUNNER_TEMP\glslang.zip"
          Invoke-WebRequest $asset.browser_download_url -OutFile $zip
          Expand-Archive $zip -DestinationPath C:\glslang-x -Force
          $exe = Get-ChildItem C:\glslang-x -Recurse -Include glslangValidator.exe, glslang.exe | Select-Object -First 1
          if (-not $exe) { throw "glslang.exe nao esta no zip" }
          New-Item -ItemType Directory -Force C:\glslang\bin | Out-Null
          Copy-Item (Join-Path $exe.DirectoryName '*') C:\glslang\bin -Recurse -Force
          if (-not (Test-Path C:\glslang\bin\glslangValidator.exe)) { Copy-Item C:\glslang\bin\glslang.exe C:\glslang\bin\glslangValidator.exe }
          & C:\glslang\bin\glslangValidator.exe --version
          exit 0

      - name: Perl nativo (Strawberry)
        shell: pwsh
        run: |
          if (-not (Test-Path C:\Strawberry\perl\bin\perl.exe)) { choco install strawberryperl -y --no-progress }
          if (-not (Test-Path C:\Strawberry\perl\bin\perl.exe)) { throw "Strawberry Perl ausente" }
          & C:\Strawberry\perl\bin\perl.exe -v | Select-Object -First 2
          exit 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache do Mesa (spirv_to_dxil)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\..\mesa-build\build-uwp\src\microsoft\spirv_to_dxil\spirv_to_dxil.dll
          key: mesa-s2d-${{ hashFiles('tools/xbox/build-spirv-to-dxil.ps1', 'tools/xbox/mesa/**', 'externals/spirv-to-dxil/include/**') }}

      - name: Compilar spirv_to_dxil (Mesa) se nao estiver no cache
        shell: pwsh
        timeout-minutes: 90
        run: |
          $dll = "${{ github.workspace }}\..\mesa-build\build-uwp\src\microsoft\spirv_to_dxil\spirv_to_dxil.dll"
          if (Test-Path $dll) { Write-Host "Mesa em cache"; exit 0 }
          # Baixa o codigo do Mesa com curl antes (o script pula o download se o arquivo ja existe).
          $work = "${{ github.workspace }}\..\mesa-build"
          New-Item -ItemType Directory -Force $work | Out-Null
          $ver = (Select-String -Path tools\xbox\build-spirv-to-dxil.ps1 -Pattern '\$MesaVersion = "([0-9.]+)"').Matches[0].Groups[1].Value
          curl.exe -fsSL --retry 3 -o "$work\mesa-$ver.tar.xz" "https://archive.mesa3d.org/mesa-$ver.tar.xz"
          if ($LASTEXITCODE) { Write-Host "::error::download do Mesa $ver falhou"; exit 1 }
          Write-Host "Mesa $ver baixado: $((Get-Item "$work\mesa-$ver.tar.xz").Length) bytes"
          # Extrai com Python (o tar.exe do Windows travava nos symlinks do pacote do Mesa).
          # O script pula a extracao quando encontra o meson.build.
          python -c "import tarfile,sys; t=tarfile.open(sys.argv[1]); t.extractall(sys.argv[2], members=[m for m in t.getmembers() if not (m.issym() or m.islnk())])" "$work\mesa-$ver.tar.xz" "$work"
          if ($LASTEXITCODE -or -not (Test-Path "$work\mesa-$ver\meson.build")) { Write-Host "::error::extracao do Mesa falhou"; exit 1 }
          Write-Host "Mesa extraido"
          & .github\scripts\run-logged.ps1 -Name mesa -Command "powershell -ExecutionPolicy Bypass -File tools\xbox\build-spirv-to-dxil.ps1"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not (Test-Path $dll)) { Write-Host "::error::spirv_to_dxil.dll nao foi gerado"; exit 1 }

      - name: Cache das dependencias (CPM)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\..\cpm-cache
          key: cpm-${{ hashFiles('cpmfile.json', '**/cpmfile.json') }}

      - name: Restaurar compilacao anterior (cache)
        id: buildcache
        uses: actions/cache/restore@v4
        with:
          path: build-uwp
          key: build-uwp-${{ github.sha }}
          restore-keys: build-uwp-

      - name: Ajustar datas para recompilar so o que mudou
        if: steps.buildcache.outputs.cache-matched-key != ''
        shell: pwsh
        run: |
          # O checkout deixa todos os fontes com a data de agora, o que faria o ninja recompilar tudo.
          # Marca a compilacao restaurada como mais nova e so os arquivos alterados desde o commit
          # que gerou o cache como mais novos ainda.
          $old = (Get-Content build-uwp\.cached_sha -ErrorAction SilentlyContinue | Select-Object -First 1)
          if (-not $old) { Write-Host "cache sem commit de origem: recompila tudo"; Remove-Item build-uwp -Recurse -Force; exit 0 }
          git fetch -q --depth=1 origin $old
          if ($LASTEXITCODE) { Write-Host "commit do cache indisponivel: recompila tudo"; Remove-Item build-uwp -Recurse -Force; exit 0 }
          $now = Get-Date
          Get-ChildItem build-uwp -Recurse -File | ForEach-Object { $_.LastWriteTime = $now }
          $changed = git diff --name-only $old HEAD
          $later = $now.AddMinutes(2)
          foreach ($f in $changed) { if (Test-Path $f) { (Get-Item $f).LastWriteTime = $later } }
          Write-Host "cache de $old; arquivos alterados desde entao: $(@($changed).Count)"
          exit 0

      - name: Configurar (CMake, preset uwp-x64)
        shell: pwsh
        run: .github\scripts\run-logged.ps1 -Name configure -Command "tools\xbox\build-env.bat cmake --preset uwp-x64"

      - name: Compilar o app (eden-uwp)
        shell: pwsh
        run: .github\scripts\run-logged.ps1 -Name build -Command "tools\xbox\build-env.bat cmake --build --preset uwp-x64 --target eden-uwp"

      - name: Guardar compilacao para o proximo build (cache)
        if: success()
        shell: pwsh
        run: |
          "${{ github.sha }}" | Set-Content build-uwp\.cached_sha
          Get-ChildItem build-uwp -Recurse -Include *.pdb, *.ilk -File | Remove-Item -Force -ErrorAction SilentlyContinue
          "{0:N1} GB" -f ((Get-ChildItem build-uwp -Recurse -File | Measure-Object Length -Sum).Sum / 1GB)

      - uses: actions/cache/save@v4
        if: success() && steps.buildcache.outputs.cache-hit != 'true'
        with:
          path: build-uwp
          key: build-uwp-${{ github.sha }}

      - name: Empacotar e assinar o .appx
        shell: pwsh
        run: |
          # O Windows PowerShell 5.1 chamado de dentro do pwsh 7 herda o PSModulePath do 7 e
          # perde o drive Cert: (usado para assinar). Volta para os modulos dele.
          & .github\scripts\run-logged.ps1 -Name package -Command "set PSModulePath=%SystemRoot%\system32\WindowsPowerShell\v1.0\Modules&& powershell -ExecutionPolicy Bypass -File tools\xbox\package-appx.ps1 -Library -BootCfg jit_prewarm=1"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem build-uwp\package -Filter *.appx
          Get-ChildItem build-uwp\package -Filter *.cer

      - name: Guardar o pacote (artefato do build)
        uses: actions/upload-artifact@v4
        with:
          name: huehue-switch-${{ env.APP_VERSION }}
          path: |
            build-uwp/package/huehue-switch.appx
            build-uwp/package/huehue-switch.cer
            build-uwp/package/Microsoft.VCLibs.x64.14.00.appx
          if-no-files-found: error

      - name: Publicar Release
        # Branches de trabalho so deixam o artifact; Release sai da main.
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: NS HUEHUE ${{ env.APP_VERSION }}
          body: |
            Instale pelo Device Portal do Xbox (https://IP-DO-XBOX:11443) -> Add:
            1. huehue-switch.appx
            2. Em dependencias: Microsoft.VCLibs.x64.14.00.appx
            3. Se pedir certificado: huehue-switch.cer
            Depois: app em modo **Game**. Guia completo no README.
          files: |
            build-uwp/package/huehue-switch.appx
            build-uwp/package/huehue-switch.cer
            build-uwp/package/Microsoft.VCLibs.x64.14.00.appx

      - name: Logs de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-falha
          path: |
            build-uwp/CMakeFiles/CMakeOutput.log
            build-uwp/CMakeFiles/CMakeError.log
            build-uwp/CMakeFiles/CMakeConfigureLog.yaml
            *.log
          if-no-files-found: ignore

      - name: Publicar logs no branch ci-logs (sempre, para diagnostico)
        if: always()
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\ci-logs"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Get-ChildItem $env:GITHUB_WORKSPACE -Filter *.log -File -ErrorAction SilentlyContinue | Copy-Item -Destination $dir
          $meson = "${{ github.workspace }}\..\mesa-build\build-uwp\meson-logs\meson-log.txt"
          if (Test-Path $meson) { Copy-Item $meson "$dir\meson-log.txt" }
          foreach ($f in @("build-uwp\CMakeFiles\CMakeConfigureLog.yaml")) { if (Test-Path $f) { Copy-Item $f $dir } }
          "run ${{ github.run_id }} / ${{ job.status }} / $(Get-Date -Format o)" | Set-Content "$dir\RUN.txt"
          # Logs grandes: guarda so o final de cada um.
          Get-ChildItem $dir -File | ForEach-Object { if ($_.Length -gt 400KB) { (Get-Content $_.FullName -Tail 4000) | Set-Content $_.FullName } }
          Set-Location $dir
          git init -q -b ci-logs
          git config user.name "huehue-ci"; git config user.email "ci@users.noreply.github.com"
          git add -A; git commit -q -m "logs run ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs
          exit 0

