# Publica como Release o pacote que um "Build Xbox" de branch de trabalho ja compilou (o build
# so publica Release a partir da main). Rodar pela aba Actions -> Publicar Release de um build.
name: Publicar Release de um build

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run do Build Xbox cujo artifact publicar"
        required: true
      name:
        description: "Nome do Release"
        required: false
        default: "NS HUEHUE"
      prerelease:
        description: "Marcar como teste (pre-release)"
        required: false
        default: "true"

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o artifact e publicar
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eE
          trap 'echo "::error::falhou: $BASH_COMMAND"' ERR
          # O artifact se chama NSHueHue-<versao> (0.4.7 em diante) ou huehue-switch-<versao>.
          gh run download "${{ inputs.run_id }}" -R "$REPO" -p "NSHueHue-*" -p "huehue-switch-*" -D dl
          art=$(ls dl)
          version=${art#NSHueHue-}
          version=${version#huehue-switch-}
          sha=$(gh api "repos/$REPO/actions/runs/${{ inputs.run_id }}" --jq .head_sha)
          mkdir pkg && find dl -type f -exec cp {} pkg/ \;
          ls -la pkg
          echo "::notice::artifact $art, versao $version, commit $sha"
          flag=""; [ "${{ inputs.prerelease }}" = "true" ] && flag="--prerelease"
          if ! gh release create "v$version" pkg/* -R "$REPO" --title "${{ inputs.name }} $version" $flag \
            --notes "Pacote do build ${{ inputs.run_id }} (commit $sha). Instale o NSHueHue-$version.appx com o VCLibs (e o .cer, se pedir) pelo Device Portal." > out.txt 2>&1; then
            echo "::error::gh release create: $(tr '\n' ' ' < out.txt)"
            exit 1
          fi
